[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "processor-dummy-service"
version = "1.0.0"
description = "Console roguelike, experiment 03 of named-by-dices"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.setuptools]
packages = ["src", "src.test"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/test/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "docs/coverage-report"
