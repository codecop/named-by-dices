name: Test 02_pac_man

on:
  push:
    paths:
      - '02_pac_man/**'
      - '.github/workflows/02_pac_man.yaml'
  pull_request:
    paths:
      - '02_pac_man/**'
      - '.github/workflows/02_pac_man.yaml'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repo
      uses: actions/checkout@v7

    - name: Set up dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcmocka-dev lcov

    - name: Build
      working-directory: 02_pac_man
      run: make

    - name: Test
      working-directory: 02_pac_man
      run: make test

    - name: Smoke
      working-directory: 02_pac_man
      run: make smoke

    - name: Coverage
      working-directory: 02_pac_man
      run: make coverage

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-02_pac_man
        path: 02_pac_man/docs/coverage-report

  windows:
    runs-on: windows-latest
    steps:
    - name: Check out the repo
      uses: actions/checkout@v7

    - name: Set up MinGW64 and cmocka
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        install: make mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmocka

    - name: Build
      working-directory: 02_pac_man
      shell: msys2 {0}
      run: make -f Makefile.win CMOCKA_ROOT=/mingw64 all

    - name: Test
      working-directory: 02_pac_man
      shell: msys2 {0}
      run: make -f Makefile.win CMOCKA_ROOT=/mingw64 test

    - name: Smoke
      working-directory: 02_pac_man
      shell: msys2 {0}
      run: make -f Makefile.win CMOCKA_ROOT=/mingw64 smoke
