name: Test 03_roguelike

on:
  push:
    paths:
      - '03_roguelike/**'
      - '.github/workflows/03_roguelike.yaml'
  pull_request:
    paths:
      - '03_roguelike/**'
      - '.github/workflows/03_roguelike.yaml'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repo
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Set up dependencies
      working-directory: 03_roguelike
      run: |
        python -m pip install --upgrade pip
        pip install pylint flake8

    - name: Lint with flake8
      working-directory: 03_roguelike
      run: flake8 src test

    - name: Lint with pylint
      working-directory: 03_roguelike
      run: PYTHONPATH=. pylint src test

    - name: Test
      working-directory: 03_roguelike
      run: ./test.sh

    - name: Smoke
      working-directory: 03_roguelike
      run: printf 'quit\n' | ./run.sh --ui stdin --seed 1
