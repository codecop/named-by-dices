name: Test 03_roguelike

on:
  push:
    paths:
      - '03_roguelike/**'
      - '.github/workflows/03_roguelike.yaml'
  pull_request:
    paths:
      - '03_roguelike/**'
      - '.github/workflows/03_roguelike.yaml'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repo
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Set up dependencies
      working-directory: 03_roguelike
      run: |
        python -m pip install --upgrade pip
        pip install pylint flake8 coverage

    - name: Lint with flake8
      working-directory: 03_roguelike
      run: flake8 src

    - name: Lint with pylint
      working-directory: 03_roguelike
      run: PYTHONPATH=. pylint src

    - name: Test
      working-directory: 03_roguelike
      run: python3 -m unittest discover -s src/test -t . -p '*_test.py'

    - name: Coverage
      working-directory: 03_roguelike
      run: |
        coverage run -m unittest discover -s src/test -t . -p '*_test.py'
        coverage report -m
        coverage html -d docs/coverage-report

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-03_roguelike
        path: 03_roguelike/docs/coverage-report
